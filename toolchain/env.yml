# Conda-forge spec for ./env  (recreate: micromamba create -p ./env -f env.yml)
# OCP 8.0.1.1 pins vtk-base 9.7.0. ParaView is NOT here: every conda-forge 6.2.x build links VTK 9.7.1+/9.7.2 libs (see SETUP_REPORT.md); ParaView.app lives in ./apps.
name: eng
channels: [conda-forge]
dependencies:
  - python=3.13
  - ocp=8.0.1.1
  - vtk=9.7.0
  - vtk-base=9.7.0
  - gmsh=4.15.2
  - python-gmsh=4.15.2
  - calculix=2.23
  - pyvista
  - meshio
  - numpy
  - scipy
  - matplotlib
  - ccx2paraview
  - numba
  - nlopt
  - casadi
  - git-lfs
  - pip
